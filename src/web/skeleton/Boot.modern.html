{DOCTYPE}
<html {HTMLATTRIBUTES}>
<head>
{HEADDECLARATIONS}
<meta name="robots" content="noindex, nofollow">
<title></title>
<noscript>
  <meta http-equiv="refresh" content="0; url='{AUTO_REDIRECT}'">
  <link href="{BOOT_STYLE_URL}&js=no" rel="stylesheet" type="text/css">
</noscript>
<style type="text/css" id="Wt-inline-css"></style>
</head>
<body>
<script type="module">
  import { WtApp } from './Wt.mjs'
  const appConfig = {
    sessionId: '{SESSION_ID}',
    scriptId: '{SCRIPT_ID}',
    selfUrl: '{SELF_URL}',
    webGLDetect: {WEBGL_DETECT},
  };
  const wtApp = new WtApp(appConfig);
  wtApp.init(); // Initialize the application
</script>
<noscript><div><p>JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p></div></noscript>
<link href="{BOOT_STYLE_URL}" rel="stylesheet" type="text/css">
</body>
