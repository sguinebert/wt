{DOCTYPE}
<html {HTMLATTRIBUTES}>
<head>

<body {BODYATTRIBUTES}>
<script>
if (!window.fetch && !window.XMLHttpRequest)
  document.body.innerHTML += `
    <form method="post" action="{RELATIVE_URL}" id="Wt-form" enctype="multipart/form-data" style="width:100%;height:100%;margin:0;">
      <input name="request" id="request" type="hidden" value="page">
      <input name="wtd" id="wtd" type="hidden" value="{SESSION_ID}">

</script>

</div>

  <form method='post' action='{RELATIVE_URL}' id='Wt-form' enctype='multipart/form-data' style='width:100%;height:100%;margin:0px;'>
    <div>
      <input name='request' id='request' type='hidden' value='page' />
      <input name='wtd' id='wtd' type='hidden' value='{SESSION_ID}' />
